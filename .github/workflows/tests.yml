name: Tests

# Runs on ordinary development, which the release workflow deliberately does
# not: release.yml fires only on `v*` tags, so until this existed a green
# check meant "it compiled on three platforms" and no test had ever run in CI.
on:
  push:
    branches: [trunk]
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the previous run's answer irrelevant.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install gfortran
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran

      # The Makefile is the release path, so break here before anything else:
      # a compile error should fail in two minutes, not after the pty suites.
      - name: Build (make)
        run: |
          make clean || true
          make 2>&1 | tee /tmp/build.log

      # A warning-free build is a property worth keeping, not a nice-to-have:
      # the four that prompted this were gfortran saying it had moved large
      # locals to STATIC storage, which quietly makes a procedure
      # non-reentrant. They were also visible to anyone installing from the
      # AUR, which is a poor first impression. Fails the build so a new one
      # cannot accumulate unnoticed.
      - name: Windows branches still compile
        run: make check-windows

      - name: No compiler warnings
        run: |
          if grep -iE '(^|[^-])warning:' /tmp/build.log; then
            echo "::error::the build emitted warnings (see above)"
            exit 1
          fi
          echo "clean build"

      - name: Version reports
        run: ./fac --version

      # Free-form Fortran truncates at column 132. This failed only on Linux
      # CI at release time, because the Makefile passes -ffree-line-length-none
      # on macOS and Windows but not Linux, and a recent gfortran defaults to
      # unlimited -- so neither a local build nor two of the three release
      # builds enforced the documented limit. Check it directly, in seconds,
      # rather than discovering it when a tag is already pushed.
      - name: Source lines fit in 132 columns
        run: |
          bad=$(awk 'length($0) > 132 {print FILENAME":"FNR": "length($0)" chars"}' \
                $(git ls-files '*.f90'))
          if [ -n "$bad" ]; then
            echo "$bad"
            echo ""
            echo "Free-form Fortran truncates at column 132; split with a & continuation."
            exit 1
          fi
          echo "all source lines fit"

      # And prove it the way the compiler sees it, not just by counting.
      - name: Compile with the limit enforced
        run: |
          for f in $(git ls-files 'src/*.f90' 'src/**/*.f90' 'app/*.f90'); do
            gfortran -fsyntax-only -ffree-line-length-132 -Werror=line-truncation \
                     -I. "$f" 2>&1 | grep -i "truncat" && exit 1
          done
          echo "no truncation"


      # make writes .mod files into the repo root, and gfortran searches the
      # working directory before any -I path -- so fpm reads make's modules
      # instead of its own and dies with "Reading module ... Expected left
      # parenthesis" when the two disagree. Clear them before fpm runs; the
      # build above has already served its purpose as the fast-fail check.
      - name: Remove make's module files before fpm builds
        run: |
          make clean
          test -z "$(ls *.mod 2>/dev/null)" || { echo "stale .mod remain"; exit 1; }

      - uses: fortran-lang/setup-fpm@v7
        with:
          fpm-version: 'v0.12.0'

      - name: Compiler versions
        run: |
          gfortran --version | head -1
          fpm --version | head -2

      - name: Unit tests (fpm)
        run: fpm test

      # Live sockets against a local fixture server, so it needs its own
      # harness rather than fpm's runner.
      - name: HTTP transport test
        run: sh test/run_ai_http_test.sh

  integration:
    name: Integration (pty) ${{ matrix.shard }}/6
    runs-on: ubuntu-latest
    # Only worth the runner minutes once the build and unit tests are green.
    needs: unit
    # Sharded because these ran as one serial step and grew into a 25-minute
    # wall: every suite added pushed the total closer to it, and the run that
    # hit it had already PASSED fifteen suites before being killed partway
    # through the sixteenth. A timeout that fires on a healthy suite tells you
    # nothing about the code.
    #
    # fail-fast off so one slow or broken shard does not cancel the others and
    # hide their results.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v6

      - name: Install gfortran
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran

      - name: Build (make)
        run: |
          make clean || true
          make

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      # Without both of these every suite exits 0 without running, so install
      # them rather than letting the run go quietly green.
      - name: Install pty test dependencies
        run: pip install pexpect pyte

      # The suites are discovered by glob, so a new one is covered the moment
      # it is written. They drive a real pty and are slower than the unit
      # tests; the timeout is a backstop against one hanging on a prompt.
      #
      # A suite that self-skips exits 0, which is indistinguishable from one
      # that passed -- that is how the missing dependency went unnoticed
      # locally. Here the dependencies are installed above, so a dependency
      # skip means the setup is broken and the job must fail rather than go
      # quietly green.
      - name: Integration suites
        timeout-minutes: 30
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: 6
        run: |
          # Without this the pipeline below reports tee's status, not the
          # suite's, and every failure would read as a pass.
          set -o pipefail
          fail=""
          skip=""
          ran=0
          i=0
          for suite in test/integration_*.py; do
            i=$((i + 1))
            # Round-robin rather than contiguous blocks: the slow suites are
            # scattered through the alphabet, and splitting into contiguous
            # ranges would land several of them on one runner.
            if [ $(( (i - 1) % SHARDS + 1 )) -ne "$SHARD" ]; then
              continue
            fi
            ran=$((ran + 1))
            name=$(basename "$suite")
            echo ""
            echo "--- $name ---"
            if python3 "$suite" 2>&1 | tee /tmp/suite.out; then
              :
            else
              fail="$fail $name"
            fi
            if grep -q "SKIP: missing dependency" /tmp/suite.out; then
              skip="$skip $name"
            fi
          done
          # A shard that matched nothing means the sharding arithmetic is wrong,
          # which would otherwise pass silently as "no failures".
          if [ "$ran" -eq 0 ]; then
            echo "Shard $SHARD of $SHARDS ran no suites at all"
            exit 1
          fi
          echo ""
          echo "Shard $SHARD of $SHARDS ran $ran suite(s)"
          if [ -n "$fail" ]; then
            echo ""
            echo "Failed suites:$fail"
          fi
          if [ -n "$skip" ]; then
            echo ""
            echo "Suites that skipped instead of running:$skip"
          fi
          if [ -n "$fail" ] || [ -n "$skip" ]; then
            exit 1
          fi
