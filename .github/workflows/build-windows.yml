name: Build Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-gcc-fortran
          mingw-w64-x86_64-gcc
          make

    - name: Build facsimile
      shell: msys2 {0}
      run: |
        make clean || true
        make release

    - name: Create release archive
      shell: msys2 {0}
      run: |
        VERSION=$(cat VERSION)
        mkdir -p release
        cp fac.exe release/
        cp README.md release/
        cd release
        tar -czvf ../facsimile-${VERSION}-windows-x86_64.tar.gz *

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: facsimile-windows-x86_64
        path: facsimile-*-windows-x86_64.tar.gz

    - name: Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: facsimile-*-windows-x86_64.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install gfortran
      run: |
        sudo apt-get update
        sudo apt-get install -y gfortran

    - name: Build facsimile
      run: |
        make clean || true
        make release

    - name: Create release archive
      run: |
        VERSION=$(cat VERSION)
        mkdir -p release
        cp fac release/
        cp README.md release/
        cd release
        tar -czvf ../facsimile-${VERSION}-linux-x86_64.tar.gz *

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: facsimile-linux-x86_64
        path: facsimile-*-linux-x86_64.tar.gz

    - name: Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: facsimile-*-linux-x86_64.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install gfortran
      run: |
        brew install gcc

    - name: Build facsimile
      run: |
        make clean || true
        make release

    - name: Create release archive
      run: |
        VERSION=$(cat VERSION)
        ARCH=$(uname -m)
        mkdir -p release
        cp fac release/
        cp README.md release/
        cd release
        tar -czvf ../facsimile-${VERSION}-macos-${ARCH}.tar.gz *

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: facsimile-macos
        path: facsimile-*-macos-*.tar.gz

    - name: Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: facsimile-*-macos-*.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
